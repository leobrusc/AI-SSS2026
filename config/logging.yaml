version: 1
disable_existing_loggers: false

formatters:
  json:
    class: "traceai.logging_config.JsonFormatter"
    format: "%(asctime)s %(name)s %(levelname)s %(message)s"
  console:
    format: "%(asctime)s [%(levelname)-8s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: console
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: json
    filename: "workspace/traceai.log"
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf-8

loggers:
  traceai:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  traceai.service:
    level: INFO
    handlers: [console, file]
    propagate: false
  uvicorn:
    level: WARNING
    handlers: [console]
    propagate: false

root:
  level: WARNING
  handlers: [console]
