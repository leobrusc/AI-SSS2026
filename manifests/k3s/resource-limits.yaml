apiVersion: v1
kind: LimitRange
metadata:
  name: traceai-limit-range
  namespace: traceai
spec:
  limits:
    - type: Container
      default:
        memory: "1Gi"
        cpu: "1000m"
      defaultRequest:
        memory: "256Mi"
        cpu: "250m"
      max:
        memory: "4Gi"
        cpu: "4000m"
      min:
        memory: "64Mi"
        cpu: "50m"
    - type: Pod
      max:
        memory: "8Gi"
        cpu: "8000m"
