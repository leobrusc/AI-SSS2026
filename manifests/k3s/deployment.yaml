apiVersion: apps/v1
kind: Deployment
metadata:
  name: traceai-inference
  namespace: traceai
  labels:
    app: traceai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traceai-inference
  template:
    metadata:
      labels:
        app: traceai-inference
    spec:
      containers:
        - name: inference
          image: traceai-inference:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-storage
              mountPath: /app/models
              readOnly: true
          envFrom:
            - configMapRef:
                name: traceai-inference-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: traceai-models-pvc
