name: AI-SSS 2026 checks
on:
  push:
    branches: [main, camera-ready-a100-prep]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.1"
          python-version: "3.11"
      - run: uv lock --check
      - run: uv sync --locked --extra dev
      - run: uv run --locked pytest
      - run: uv run --locked python scripts/a100/benchmark.py --dry-run
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/a100/run_all.sh
